name: Reusable Build Debug APK

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string
      pr_sha:
        description: "PR head SHA"
        required: true
        type: string
      node_version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      package_manager:
        description: "Package manager to use: pnpm, npm, or yarn"
        required: false
        type: string
        default: "pnpm"
      pnpm_version:
        description: "pnpm version (used only when package_manager is pnpm)"
        required: false
        type: string
        default: "10.26.2"

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack (pnpm)
        if: inputs.package_manager == 'pnpm'
        run: corepack enable && corepack prepare pnpm@${{ inputs.pnpm_version }} --activate

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Build Web App
        run: |
          if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm build
          elif [ "${{ inputs.package_manager }}" = "yarn" ]; then
            yarn build
          else
            npm run build
          fi

      - name: Sync Capacitor
        run: |
          if [ "${{ inputs.package_manager }}" = "pnpm" ]; then
            pnpm cap sync android
          else
            npx cap sync android
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug -PciSuffix=ci_${{ inputs.pr_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-pr-${{ inputs.pr_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.pr_number }}'),
              body: [
                "📦 **Debug APK build completed**",
                "",
                `🔗 Workflow run: ${runUrl}`,
                "",
                "📎 Download APK from Artifacts."
              ].join("\n")
            });
