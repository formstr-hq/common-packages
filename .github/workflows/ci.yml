name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # version is read from the root package.json "packageManager" field

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build before typecheck/test: @formstr/agent (and @formstr/mcp) consume
      # @formstr/core and @formstr/calendar-sdk as workspace packages, and those
      # resolve to the *published* dist/. On a clean checkout dist/ does not
      # exist yet, so typecheck and the agent tests fail until the workspace is
      # built. pnpm -r build is topologically ordered.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test with coverage
        run: pnpm -r --if-present test:coverage
